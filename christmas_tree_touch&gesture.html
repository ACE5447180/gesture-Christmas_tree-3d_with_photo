        function setupTouchAndClick() {
            const container = document.getElementById('canvas-container');
            container.addEventListener('pointerdown', (e) => {
                STATE.touch.active = true;
                STATE.touch.startX = e.clientX;
                STATE.touch.startY = e.clientY;
                STATE.touch.lastX = e.clientX;
                STATE.touch.lastY = e.clientY;
            });
            window.addEventListener('pointermove', (e) => {
                if (!STATE.touch.active) return;
                const deltaX = e.clientX - STATE.touch.lastX;
                const deltaY = e.clientY - STATE.touch.lastY;
                STATE.rotation.y += deltaX * 0.005;
                STATE.rotation.x += deltaY * 0.002;
                STATE.rotation.x = Math.max(-0.5, Math.min(0.5, STATE.rotation.x));
                STATE.touch.lastX = e.clientX;
                STATE.touch.lastY = e.clientY;
            });
            window.addEventListener('pointerup', (e) => {
                STATE.touch.active = false;
            });
            container.addEventListener('click', (e) => {
                const moveDist = Math.hypot(e.clientX - STATE.touch.startX, e.clientY - STATE.touch.startY);
                if (moveDist > 10) return;
                mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
                raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObjects(mainGroup.children, true);
                let clickedPhoto = null;
                for (let hit of intersects) {
                    let obj = hit.object;
                    while(obj.parent && obj.parent !== mainGroup && obj.parent !== photoMeshGroup) {
                        obj = obj.parent;
                    }
                    const particle = particleSystem.find(p => p.mesh === obj && p.type === 'PHOTO');
                    if (particle) { clickedPhoto = particle; break; }
                }
                if (clickedPhoto) {
                    STATE.mode = 'FOCUS';
                    STATE.focusTarget = clickedPhoto.mesh;
                } else {
                    if (STATE.mode === 'FOCUS') {
                        STATE.mode = 'TREE';
                        STATE.focusTarget = null;
                    }
                }
            });
            let lastTap = 0;
            container.addEventListener('touchend', (e) => {
                const currentTime = new Date().getTime();
                const tapLength = currentTime - lastTap;
                if (tapLength < 300 && tapLength > 0) {
                    STATE.mode = (STATE.mode === 'SCATTER') ? 'TREE' : 'SCATTER';
                    e.preventDefault();
                }
                lastTap = currentTime;
            });
        }

            for(let i=-128; i<256; i+=32) {

        function createSnow() {

            context.fillStyle = 'white'; context.beginPath();

        function updateSnow() {
            if (!snowSystem) return;
            const positions = snowSystem.geometry.attributes.position.array;
            const userData = snowSystem.geometry.attributes.userData.array;
            for (let i = 0; i < CONFIG.particles.snowCount; i++) {
                const fallSpeed = userData[i * 2];
                positions[i * 3 + 1] -= fallSpeed;
                const swaySpeed = userData[i * 2 + 1];
                positions[i * 3] += Math.sin(clock.elapsedTime * 2 + i) * swaySpeed * 0.1;
                if (positions[i * 3 + 1] < -30) {
                    positions[i * 3 + 1] = 30;
                    positions[i * 3] = THREE.MathUtils.randFloatSpread(100);
                    positions[i * 3 + 2] = THREE.MathUtils.randFloatSpread(60);

            }
            snowSystem.geometry.attributes.position.needsUpdate = true;

        class Particle {
            constructor(mesh, type, isDust = false) {
                this.mesh = mesh; this.type = type; this.isDust = isDust;
                this.posTree = new THREE.Vector3(); this.posScatter = new THREE.Vector3();
                this.baseScale = mesh.scale.x;
                this.treeTier = Math.floor(Math.random() * CONFIG.particles.tierCount);
                this.treeAngle = Math.random() * Math.PI * 2;
                this.treePhase = Math.random() * Math.PI * 2;
                this.treeStyle = Math.random();
                const speedMult = (type === 'PHOTO') ? 0.3 : 2.0;
                this.spinSpeed = new THREE.Vector3((Math.random()-0.5)*speedMult, (Math.random()-0.5)*speedMult, (Math.random()-0.5)*speedMult);
                this.calculatePositions();
            }
            calculatePositions() {
                if (this.type === 'PHOTO') {
                    this.posTree.set(0, 0, 0);
                    const rScatter = 8 + Math.random()*12;
                    const theta = Math.random() * Math.PI * 2;
                    const phi = Math.acos(2 * Math.random() - 1);
                    this.posScatter.set(rScatter * Math.sin(phi) * Math.cos(theta), rScatter * Math.sin(phi) * Math.sin(theta), rScatter * Math.cos(phi));
                    return;
                }
                const h = CONFIG.particles.treeHeight;
                const tierCount = CONFIG.particles.tierCount;
                const tierProgress = Math.pow(Math.random(), 0.74);
                const normalizedHeight = Math.min(
                    0.985,
                    (this.treeTier + tierProgress) / tierCount
                );
                const radiusAtLevel =
                    CONFIG.particles.treeRadius *
                    Math.pow(normalizedHeight, 0.9);
                const branchFlare =
                    0.86 +
                    0.14 * (1 - tierProgress) +
                    0.025 * Math.cos(this.treePhase);
                let radialBias;
                let angle;
                if (this.treeStyle < 0.7) {
                    angle = this.treeAngle;
                    radialBias = 0.7 + Math.random() * 0.3;
                } else if (this.treeStyle < 0.88) {
                    angle =
                        normalizedHeight * Math.PI * 5.4 +
                        this.treeTier * 0.42 +
                        this.treePhase * 0.08;
                    radialBias = 0.74 + Math.random() * 0.2;
                } else {
                    angle = this.treeAngle;
                    radialBias = 0.12 + Math.random() * 0.58;
                }
                const radius = radiusAtLevel * branchFlare * radialBias;
                const branchSag =
                    (Math.random() - 0.5) *
                    (h / tierCount) *
                    (0.18 + radialBias * 0.22);
                const y = h / 2 - normalizedHeight * h + branchSag;
                this.posTree.set(
                    Math.cos(angle) * radius,
                    y,
                    Math.sin(angle) * radius
                );
                let rScatter = this.isDust ? (12 + Math.random()*20) : (8 + Math.random()*12);
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(2 * Math.random() - 1);
                this.posScatter.set(rScatter * Math.sin(phi) * Math.cos(theta), rScatter * Math.sin(phi) * Math.sin(theta), rScatter * Math.cos(phi));
            }
            update(dt, mode, focusTargetMesh) {
                let target = (mode === 'SCATTER') ? this.posScatter : this.posTree;
                if (mode === 'FOCUS') {
                    if (this.mesh === focusTargetMesh) {
                        const desiredWorldPos = new THREE.Vector3(0, 2, 35);
                        const invMatrix = new THREE.Matrix4().copy(mainGroup.matrixWorld).invert();
                        target = desiredWorldPos.applyMatrix4(invMatrix);
                    } else target = this.posScatter;
                }
                const lerpSpeed = (mode === 'FOCUS' && this.mesh === focusTargetMesh) ? 5.0 : 2.0;
                this.mesh.position.lerp(target, lerpSpeed * dt);
                if (mode === 'SCATTER') {
                    this.mesh.rotation.x += this.spinSpeed.x * dt;
                    this.mesh.rotation.y += this.spinSpeed.y * dt;
                    this.mesh.rotation.z += this.spinSpeed.z * dt;
                } else if (mode === 'TREE') {
                    if (this.type === 'PHOTO') {
                        this.mesh.lookAt(0, this.mesh.position.y, 0);
                        this.mesh.rotateY(Math.PI);
                    } else {
                        this.mesh.rotation.x = THREE.MathUtils.lerp(this.mesh.rotation.x, 0, dt);
                        this.mesh.rotation.z = THREE.MathUtils.lerp(this.mesh.rotation.z, 0, dt);
                        this.mesh.rotation.y += 0.5 * dt;
                    }
                }
                if (mode === 'FOCUS' && this.mesh === focusTargetMesh) this.mesh.lookAt(camera.position);
                let s = this.baseScale;
                if (this.isDust) {
                    s = this.baseScale * (0.8 + 0.4 * Math.sin(clock.elapsedTime * 4 + this.mesh.id));
                    if (mode === 'TREE') s = 0;
                } else if (mode === 'SCATTER' && this.type === 'PHOTO') s = this.baseScale * 2.5;
                else if (mode === 'FOCUS') {
                    if (this.mesh === focusTargetMesh) s = 4.5; else s = this.baseScale * 0.8;
                }
                this.mesh.scale.lerp(new THREE.Vector3(s,s,s), 4*dt);
            }
        }

        function updatePhotoLayout() {
            const photos = particleSystem.filter(p => p.type === 'PHOTO');
            const count = photos.length;
            if (count === 0) return;
            const h = CONFIG.particles.treeHeight * 0.9;
            const bottomY = -h/2; const stepY = h / count; const loops = 3;
            photos.forEach((p, i) => {
                const y = bottomY + stepY * i + stepY/2;
                const normalizedH = (y + h/2) / CONFIG.particles.treeHeight;
                const r = Math.max(1.0, CONFIG.particles.treeRadius * (1.0 - normalizedH)) + 3.0;
                const angle = normalizedH * Math.PI * 2 * loops + (Math.PI/4);
                p.posTree.set(Math.cos(angle) * r, y, Math.sin(angle) * r);
            });
        }

        function createParticles() {
            const sphereGeo = new THREE.SphereGeometry(0.5, 12, 12);
            const facetGeo = new THREE.OctahedronGeometry(0.52, 0);
            const softGeo = new THREE.IcosahedronGeometry(0.46, 0);

            const roseGoldMat = new THREE.MeshStandardMaterial({

            });
            const paleGoldMat = new THREE.MeshStandardMaterial({
                color: 0xffefc4,

                emissive: 0x6b4718,
                emissiveIntensity: 0.38,
                transparent: true,
                opacity: 0.88
            });
            const materials = [pinkMat, blushMat, roseGoldMat, goldMat, paleGoldMat];
            const geometries = [sphereGeo, facetGeo, softGeo];
            for (let i = 0; i < CONFIG.particles.count; i++) {
                const rand = Math.random();
                const materialIndex =
                    rand < 0.27 ? 0 :
                    rand < 0.52 ? 1 :
                    rand < 0.73 ? 2 :
                    rand < 0.93 ? 3 : 4;
                const geometryIndex =
                    rand < 0.6 ? 0 :
                    rand < 0.84 ? 1 : 2;
                const mesh = new THREE.Mesh(
                    geometries[geometryIndex],
                    materials[materialIndex]
                );
                const type =
                    materialIndex < 2 ? 'PINK' :
                    materialIndex === 4 ? 'PALE_GOLD' : 'GOLD';
                const s = Math.random() < 0.86
                    ? 0.24 + Math.random() * 0.32
                    : 0.5 + Math.random() * 0.34;
                mesh.scale.set(s,s,s); mesh.rotation.set(Math.random()*6, Math.random()*6, Math.random()*6);
                mainGroup.add(mesh);
                particleSystem.push(new Particle(mesh, type, false));
            }
            const starCanvas = document.createElement("canvas");
            starCanvas.width = 256;
            starCanvas.height = 256;
            const starContext = starCanvas.getContext("2d");
            const starGlow = starContext.createRadialGradient(128, 128, 0, 128, 128, 126);
            starGlow.addColorStop(0, "rgba(255, 249, 224, 0.96)");
            starGlow.addColorStop(0.22, "rgba(255, 204, 224, 0.58)");
            starGlow.addColorStop(0.58, "rgba(255, 104, 173, 0.14)");
            starGlow.addColorStop(1, "rgba(255, 78, 154, 0)");
            starContext.fillStyle = starGlow;
            starContext.fillRect(0, 0, 256, 256);
            starContext.save();
            starContext.translate(128, 128);
            starContext.beginPath();
            for (let i = 0; i < 10; i++) {
                const angle = -Math.PI / 2 + i * Math.PI / 5;
                const radius = i % 2 === 0 ? 68 : 29;
                const x = Math.cos(angle) * radius;
                const y = Math.sin(angle) * radius;
                if (i === 0) starContext.moveTo(x, y);
                else starContext.lineTo(x, y);
            }
            starContext.closePath();
            const starFill = starContext.createLinearGradient(0, -68, 0, 68);
            starFill.addColorStop(0, "#fffbea");
            starFill.addColorStop(0.46, "#ffe2a2");
            starFill.addColorStop(0.78, "#ff9fc5");
            starFill.addColorStop(1, "#f2c66e");
            starContext.fillStyle = starFill;
            starContext.shadowColor = "rgba(255, 151, 198, 0.9)";
            starContext.shadowBlur = 28;
            starContext.fill();
            starContext.shadowBlur = 0;
            starContext.strokeStyle = "rgba(255, 252, 229, 0.9)";
            starContext.lineWidth = 2;
            starContext.stroke();
            starContext.restore();
            const starTexture = new THREE.CanvasTexture(starCanvas);
            const star = new THREE.Sprite(
                new THREE.SpriteMaterial({
                    map: starTexture,
                    transparent: true,
                    blending: THREE.AdditiveBlending,
                    depthWrite: false
                })
            );
            star.position.set(0, CONFIG.particles.treeHeight / 2 + 1.65, 0);
            star.scale.set(7.2, 7.2, 1);
            mainGroup.add(star);
            mainGroup.add(photoMeshGroup);

        function addPhotoToScene(texture) {
            const frameGeo = new THREE.BoxGeometry(1.4, 1.4, 0.05);
            const frameMat = new THREE.MeshStandardMaterial({ color: CONFIG.colors.champagneGold, metalness: 1.0, roughness: 0.1 });
            const frame = new THREE.Mesh(frameGeo, frameMat);
            let width = 1.2; let height = 1.2;
            if (texture.image) {
                const aspect = texture.image.width / texture.image.height;
                if (aspect > 1) height = width / aspect; else width = height * aspect;
            }
            const photoGeo = new THREE.PlaneGeometry(width, height);
            const photoMat = new THREE.MeshBasicMaterial({ map: texture, side: THREE.DoubleSide });
            const photo = new THREE.Mesh(photoGeo, photoMat);
            photo.position.z = 0.04;
            const group = new THREE.Group();
            group.add(frame); group.add(photo);
            frame.scale.set(width/1.2, height/1.2, 1);
            const s = 0.8; group.scale.set(s,s,s);
            photoMeshGroup.add(group);
            particleSystem.push(new Particle(group, 'PHOTO', false));
            updatePhotoLayout();
        }

        function handleImageUpload(e) {
            const files = e.target.files;
            if(!files.length) return;
            Array.from(files).forEach(f => {
                if (!f.type.startsWith('image/')) return;
                const reader = new FileReader();
                reader.onload = (ev) => {

                        t.colorSpace = THREE.SRGBColorSpace;
                        addPhotoToScene(t);
                    });
                }
                reader.readAsDataURL(f);
            });
        }

        function updateCountdown() {
            const output = document.getElementById('countdown-line');
            if (!output) return;
            const now = new Date();
            let year = now.getFullYear();
            let target = new Date(year, 11, 25, 0, 0, 0, 0);
            const christmasEnd = new Date(year, 11, 26, 0, 0, 0, 0);

            if (now >= christmasEnd) {
                year += 1;
                target = new Date(year, 11, 25, 0, 0, 0, 0);
            }

            if (now >= target && now < christmasEnd) {
                output.innerHTML = "圣诞快乐 · <strong>Merry Christmas</strong>";
                return;
            }

            const remaining = Math.max(0, target - now);
            const days = Math.floor(remaining / 86400000);
            const hours = Math.floor((remaining / 3600000) % 24);
            const minutes = Math.floor((remaining / 60000) % 60);
            const seconds = Math.floor((remaining / 1000) % 60);
            const pad = value => String(value).padStart(2, "0");
            output.innerHTML =
                `距离 ${year} 圣诞节 · <strong>${days} 天 ${pad(hours)}:${pad(minutes)}:${pad(seconds)}</strong>`;
        }

        function setMusicState(state) {
            if (!musicToggle || !musicLabel) return;
            musicToggle.classList.toggle("is-playing", state === "playing");
            musicToggle.classList.toggle("is-pending", state === "pending");
            musicToggle.setAttribute(
                "aria-pressed",
                state === "playing" ? "true" : "false"
            );
            musicToggle.setAttribute(
                "aria-label",
                state === "playing" ? "暂停背景音乐" : "播放背景音乐"
            );
            if (state === "playing") musicLabel.textContent = "音乐开启";
            else if (state === "pending") musicLabel.textContent = "音乐加载中";
            else if (state === "error") musicLabel.textContent = "音乐加载失败";
            else musicLabel.textContent = "开启音乐";
        }

        async function startMusic() {
            if (!backgroundMusic || !backgroundMusic.paused) return;
            if (musicRequest) return musicRequest;
            setMusicState("pending");
            backgroundMusic.volume = 0.68;
            musicRequest = backgroundMusic.play()
                .then(() => setMusicState("playing"))
                .catch((error) => {
                    console.warn("Background music could not start:", error);
                    setMusicState("error");
                })
                .finally(() => {
                    musicRequest = null;
                });
            return musicRequest;
        }

        function setupMusic() {
            if (!backgroundMusic || !musicToggle) return;
            musicToggle.addEventListener("click", (event) => {
                event.stopPropagation();
                if (backgroundMusic.paused) startMusic();
                else backgroundMusic.pause();
            });
            backgroundMusic.addEventListener("play", () => setMusicState("playing"));
            backgroundMusic.addEventListener("pause", () => setMusicState("idle"));
            backgroundMusic.addEventListener("error", () => setMusicState("error"));
            document.addEventListener("pointerdown", (event) => {
                if (event.target.closest("#music-toggle")) return;
                if (backgroundMusic.paused) startMusic();
            }, { once: true, capture: true });
        }

        async function initMediaPipe() {
            if (isCameraRunning) return;
            camBtn.innerText = "Initializing...";
            debugInfo.innerText = "Loading AI models...";
            video = document.getElementById('webcam');
            try {
                const vision = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm");
                handLandmarker = await HandLandmarker.createFromOptions(vision, {
                    baseOptions: { modelAssetPath: `https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task`, delegate: "GPU" },
                    runningMode: "VIDEO", numHands: 1
                });
                const constraints = { video: { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 } } };
                const stream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = stream;
                video.addEventListener("loadeddata", predictWebcam);
                document.getElementById('webcam-wrapper').style.opacity = 1;
                debugInfo.innerText = "Gesture Active: Show Hand";
                camBtn.innerText = "Gesture Active";
                camBtn.classList.add('active');
                isCameraRunning = true;
            } catch(e) {
                console.warn("Camera error:", e);
                let msg = "Camera Error: " + e.name;
                if (e.name === 'NotAllowedError' || e.name === 'PermissionDeniedError') msg = "Please allow camera access!";
                else if (window.location.protocol !== 'https:' && window.location.hostname !== 'localhost') msg = "HTTPS required for camera!";
                debugInfo.innerText = msg; showMsg(msg);
                camBtn.innerText = "Retry Camera";
            }
        }

        let lastVideoTime = -1;
        async function predictWebcam() {
            if (video.currentTime !== lastVideoTime) {
                lastVideoTime = video.currentTime;
                if (handLandmarker) {
                    const result = handLandmarker.detectForVideo(video, performance.now());
                    processGestures(result);
                }
            }
            requestAnimationFrame(predictWebcam);
        }

        function processGestures(result) {
            if (result.landmarks && result.landmarks.length > 0) {
                STATE.hand.detected = true;
                const lm = result.landmarks[0];
                STATE.hand.x = (lm[9].x - 0.5) * 2;
                STATE.hand.y = (lm[9].y - 0.5) * 2;
                const wrist = lm[0]; const middleMCP = lm[9];
                const handSize = Math.hypot(middleMCP.x - wrist.x, middleMCP.y - wrist.y);
                if (handSize < 0.02) return;
                const tips = [lm[8], lm[12], lm[16], lm[20]];
                let avgTipDist = 0; tips.forEach(t => avgTipDist += Math.hypot(t.x - wrist.x, t.y - wrist.y)); avgTipDist /= 4;
                const pinchDist = Math.hypot(lm[4].x - lm[8].x, lm[4].y - lm[8].y);
                const extensionRatio = avgTipDist / handSize; const pinchRatio = pinchDist / handSize;
                debugInfo.innerText = `Gesture Detected: ${STATE.mode}`;
                if (extensionRatio < 1.5) { STATE.mode = 'TREE'; STATE.focusTarget = null; }
                else if (pinchRatio < 0.35) {
                    if (STATE.mode !== 'FOCUS') {
                        STATE.mode = 'FOCUS';
                        const photos = particleSystem.filter(p => p.type === 'PHOTO');
                        if (photos.length) STATE.focusTarget = photos[Math.floor(Math.random()*photos.length)].mesh;
                    }
                } else if (extensionRatio > 1.7) { STATE.mode = 'SCATTER'; STATE.focusTarget = null; }
            } else {
                STATE.hand.detected = false;
            }
        }

        function setupEvents() {
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
                composer.setSize(window.innerWidth, window.innerHeight);
            });
            document.getElementById('file-input').addEventListener('change', handleImageUpload);
            document.getElementById('folder-input').addEventListener('change', handleImageUpload);
            camBtn.addEventListener('click', () => { initMediaPipe(); });
            window.addEventListener('keydown', (e) => {
                const key = e.key.toLowerCase();
                if (key === 'h') {
                    const controls = document.querySelector('.controls-wrapper');
                    if (controls) controls.classList.toggle('ui-hidden');
                    const webcam = document.getElementById('webcam-wrapper');
                    if(webcam) webcam.classList.toggle('ui-hidden');
                } else if (key === 's') {
                    // 【新增】Toggle stats visibility
                    const stats = document.getElementById('footer-stats');
                    if (stats) stats.classList.toggle('ui-hidden');
                }
            });
        }

        function animate() {
            requestAnimationFrame(animate);
            const dt = clock.getDelta();
            if (STATE.hand.detected) {
                if (STATE.mode === 'SCATTER') {
                    const targetRotY = STATE.hand.x * Math.PI * 0.9;
                    const targetRotX = STATE.hand.y * Math.PI * 0.25;
                    STATE.rotation.y += (targetRotY - STATE.rotation.y) * 3.0 * dt;
                    STATE.rotation.x += (targetRotX - STATE.rotation.x) * 3.0 * dt;
                } else {
                    STATE.rotation.y += 0.3 * dt;
                }
            } else if (STATE.touch.active) {
            } else {
                if(STATE.mode === 'TREE') {
                    STATE.rotation.y += 0.3 * dt;
                    STATE.rotation.x += (0 - STATE.rotation.x) * 2.0 * dt;
                } else {
                    STATE.rotation.y += 0.1 * dt;
                }
            }
            mainGroup.rotation.y = STATE.rotation.y;
            mainGroup.rotation.x = STATE.rotation.x;
            particleSystem.forEach(p => p.update(dt, STATE.mode, STATE.focusTarget));
            updateSnow();
            composer.render();
        }
